name: PWA build
on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm install --no-audit --no-fund
      # Bootstrap the committed lockfile from the actual Node 26 CI resolver.
      # This temporary step will be removed before the PR is ready for review.
      - name: Export npm lockfile for commit
        run: |
          echo 'BITMON_LOCKFILE_BEGIN'
          base64 -w 400 package-lock.json
          echo 'BITMON_LOCKFILE_END'
      - run: npm run check
      - run: npm run build
