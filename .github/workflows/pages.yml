name: Deploy bitmon Pages

# This workflow lives on main. Successful preview CI builds trigger a
# main-context deployment so the protected github-pages environment stays main-only.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [PWA build]
    types: [completed]
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmon-pages
  cancel-in-progress: true

jobs:
  build:
    # Ignore failing checks, PR events and runs from other repositories.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'preview' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v7
        with:
          ref: main
          path: stable
          persist-credentials: false
      - name: Checkout checked preview source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'preview' }}
          path: preview
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Build stable from main
        working-directory: stable
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Build preview from preview
        working-directory: preview
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Give preview a distinct install identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const root = 'preview/dist/'
          const manifestPath = root + 'manifest.webmanifest'
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'))
          manifest.name = 'bitmon Preview'
          manifest.short_name = 'bitmon DEV'
          // Manifest id is resolved against the ORIGIN, not the manifest
          // directory. id: '.' collided with stable's origin-root identity.
          // Keep stable's existing ID unchanged; give Preview a unique one.
          manifest.id = '/bitmon/preview/'
          manifest.start_url = './?channel=preview'
          manifest.scope = './'
          manifest.theme_color = '#643da4'
          await writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n')
          const indexPath = root + 'index.html'
          let html = await readFile(indexPath, 'utf8')
          html = html.replace(/<title>[^<]*<\/title>/, '<title>bitmon Preview — Explore</title>')
            .replace('content="bitmon"', 'content="bitmon Preview"')
            .replace('content="#2e514d"', 'content="#643da4"')
            .replace('</header>', '<span>PREVIEW</span></header>')
          await writeFile(indexPath, html)
          for (const size of [192, 512]) {
            const path = root + 'icon-' + size + '.svg'
            // Distinct purple preview art, not the stable teal logo recolored.
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 512 512">
              <rect width="512" height="512" rx="112" fill="#643da4"/>
              <circle cx="256" cy="228" r="155" fill="#f8ca64"/>
              <path d="M202 114h72q88 0 88 86t-88 86h-36v76h-66V114zm36 61v50h36q24 0 24-25t-24-25z" fill="#40206f"/>
              <rect x="91" y="367" width="330" height="77" rx="29" fill="#312054"/>
              <text x="256" y="420" font-size="45" font-weight="bold" text-anchor="middle" font-family="sans-serif" fill="white">PREVIEW</text>
            </svg>`
            await writeFile(path, svg)
          }
          NODE
      - name: Package both installable PWAs under one Pages site
        run: |
          mkdir -p pages/preview
          cp -R stable/dist/. pages/
          cp -R preview/dist/. pages/preview/
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy both channels to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
