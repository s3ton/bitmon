name: PWA build
on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
