name: Deploy bitmon Pages

# This workflow lives on main. Successful preview CI builds trigger a
# main-context deployment so the protected github-pages environment stays main-only.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [PWA build]
    types: [completed]
    branches: [preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bitmon-pages
  cancel-in-progress: true

jobs:
  build:
    # Ignore failing checks, PR events and runs from other repositories.
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'preview' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main
        uses: actions/checkout@v4
        with:
          ref: main
          path: stable
          persist-credentials: false
      - name: Checkout checked preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'preview' }}
          path: preview
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build stable from main
        working-directory: stable
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Build preview from preview
        working-directory: preview
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Give preview a distinct install identity
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'
          const root = 'preview/dist/'
          const manifestPath = root + 'manifest.webmanifest'
          const manifest = JSON.parse(await readFile(manifestPath, 'utf8'))
          manifest.name = 'bitmon Preview'
          manifest.short_name = 'bitmon Test'
          // The '.' identity/scope resolve relative to /bitmon/preview/ rather
          // than /bitmon/, so these are separate installed applications.
          manifest.id = '.'
          manifest.start_url = '.'
          manifest.scope = '.'
          manifest.theme_color = '#8c5a29'
          await writeFile(manifestPath, JSON.stringify(manifest, null, 2) + '\n')
          const indexPath = root + 'index.html'
          let html = await readFile(indexPath, 'utf8')
          html = html.replace(/<title>[^<]*<\/title>/, '<title>bitmon Preview — Explore</title>')
            .replace('content="bitmon"', 'content="bitmon Preview"')
            .replace('content="#2e514d"', 'content="#8c5a29"')
            .replace('</header>', '<span>PREVIEW</span></header>')
          await writeFile(indexPath, html)
          for (const size of [192, 512]) {
            const path = root + 'icon-' + size + '.svg'
            let svg = await readFile(path, 'utf8')
            svg = svg.replace('fill="#2e514d"', 'fill="#8c5a29"')
              .replace('</svg>', '<rect x="296" y="358" width="152" height="88" rx="22" fill="#f8e4ad"/><text x="372" y="418" fill="#603e22" text-anchor="middle" font-size="52" font-family="sans-serif" font-weight="bold">DEV</text></svg>')
            await writeFile(path, svg)
          }
          NODE
      - name: Package both installable PWAs under one Pages site
        run: |
          mkdir -p pages/preview
          cp -R stable/dist/. pages/
          cp -R preview/dist/. pages/preview/
          touch pages/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy both channels to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
